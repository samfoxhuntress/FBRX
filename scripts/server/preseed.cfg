# FBRX Server: Debian 13 installed the FBRX way, then FBRX Virtual on top (late_command at the end).
#
# Asked on purpose (never answered here): which disk to install on, every "erase / write to disk" confirmation, the
# administrator's password and the time zone. Everything else is answered.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string fbrx-server
d-i netcfg/get_domain string lan
d-i netcfg/hostname string fbrx-server

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# No root password: the administrator account uses sudo.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string FBRX Administrator
d-i passwd/username string fbrx

# The whole chosen disk, LVM, GPT: one root volume (virtual disks live under /var/lib/fbrx-virtual).
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-efi/non_efi_system boolean true

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string curl ca-certificates xz-utils sudo openssl
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

d-i preseed/late_command string \
  mkdir -p /target/opt/fbrx-installer; \
  cp -r /cdrom/fbrx/. /target/opt/fbrx-installer/; \
  in-target bash /opt/fbrx-installer/install.sh --bundle /opt/fbrx-installer --yes --no-start

d-i finish-install/reboot_in_progress note
