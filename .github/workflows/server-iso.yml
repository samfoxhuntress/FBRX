name: FBRX Server ISO

# The FBRX Server installer ISO: Debian 13's network installer with FBRX Server added (scripts/server/build-iso.sh).
on:
  workflow_dispatch:
  push:
    tags: ["server-v*"]
    branches: [main, "claude/**"]
    paths:
      - "scripts/server/**"
      - "apps/virtual/**"
      - "apps/virtual-console/**"
      - ".github/workflows/server-iso.yml"

concurrency:
  group: server-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  iso:
    name: Build the installer ISO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xorriso >/dev/null
      - run: npm ci --no-audit --no-fund
      - name: Bundle FBRX Server (with Node.js, so the installer needs no extra download)
        run: scripts/server/bundle.sh --with-node
      - name: Add FBRX Server to the Debian 13 network installer
        run: scripts/server/build-iso.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fbrx-server-iso
          path: |
            dist/fbrx-server-*-amd64.iso
            dist/fbrx-server-*-amd64.iso.sha256
          retention-days: 14
          compression-level: 0
