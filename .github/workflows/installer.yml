# Runs the double-click installer exactly as a user would on a fresh Mac and Windows PC: downloads a private
# Node.js, installs dependencies, builds, installs and licenses the app. Then opens the installed app to prove it
# starts and activates its license, and runs the installer a second time over the running app (the update path).
# On Windows it also checks Setup's maintenance switches and the "make an installer to send" package.
# "Install FBRX Command" is run the same way on Linux, macOS and Windows: install, update in place, remove.
name: Installer

on:
  push:
    paths:
      - "Install FBRX OS.*"
      - "Install FBRX Command.*"
      - "apps/control-plane/**"
      - "apps/admin-console/**"
      - "scripts/setup/**"
      - "scripts/server/**"
      - "scripts/issue-license.ts"
      - "scripts/generate-license-keys.mjs"
      - "apps/desktop/**"
      - "packages/core/**"
      - "packages/shared/**"
      - "package-lock.json"
      - ".github/workflows/installer.yml"
  workflow_dispatch:

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FBRX_FORCE_PORTABLE_NODE: "1"
  FBRX_NO_PAUSE: "1"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # A small stand-in for the "fbrx-server-iso" download from GitHub Actions, where people put it: Downloads.
      - name: Put an FBRX Server ISO download in Downloads
        run: |
          mkdir -p ~/Downloads /tmp/fbrx-iso && cd /tmp/fbrx-iso
          head -c 2000000 /dev/urandom > fbrx-server-ci-amd64.iso
          shasum -a 256 fbrx-server-ci-amd64.iso > fbrx-server-ci-amd64.iso.sha256
          zip -q ~/Downloads/fbrx-server-iso.zip fbrx-server-ci-amd64.iso fbrx-server-ci-amd64.iso.sha256
      - name: Run "Install FBRX OS.command"
        run: bash "Install FBRX OS.command" --yes --name "CI Runner" --no-launch
      - name: The FBRX Server installer ISO, bundle and guides came along
        run: |
          SRV="/Applications/FBRX OS.app/Contents/Resources/server"
          ls -la "$SRV" "$SRV/docs"
          test -f "$SRV/manifest.json"
          test -f "$SRV/fbrx-server-ci-amd64.iso"
          ls "$SRV"/fbrx-server-*.tar.gz
          test -f "$SRV/docs/SERVER.md"
          codesign --verify --deep --strict "/Applications/FBRX OS.app"
      - name: The app is installed, signed for this Mac, and activates its license on first start
        run: |
          APP="/Applications/FBRX OS.app"
          DATA="$HOME/Library/Application Support/FBRX OS"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test -f "$DATA/fbrx-license.key"
          open "$APP"
          for i in $(seq 1 90); do
            if [ ! -f "$DATA/fbrx-license.key" ] && [ -f "$DATA/fbrx.db" ]; then break; fi
            sleep 2
          done
          ls -la "$DATA"
          test ! -f "$DATA/fbrx-license.key.rejected"
          test ! -f "$DATA/fbrx-license.key"
          pgrep -x "FBRX OS"
      - name: Running the installer again updates the app while it is open
        run: |
          bash "Install FBRX OS.command" --yes --name "CI Runner" --no-launch
          test -d "/Applications/FBRX OS.app"
          if pgrep -x "FBRX OS"; then echo "The installer did not close the running app"; exit 1; fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log-macos
          path: |
            .fbrx-setup/setup.log
            ~/Library/Application Support/FBRX OS/logs/
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # Double-clicked inside the downloaded zip, Explorer unpacks only the .cmd into a temporary folder named after the
      # zip. Setup then finds the zip in Downloads, unzips it (here over this checkout) and carries on from there.
      - name: Download FBRX OS as a zip and open "Install FBRX OS.cmd" inside it, as Explorer does
        shell: pwsh
        run: |
          $downloads = Join-Path $env:USERPROFILE 'Downloads'
          New-Item -ItemType Directory -Force $downloads | Out-Null
          git archive --format=zip --prefix=FBRX-test/ -o (Join-Path $downloads 'FBRX-test (2).zip') HEAD
          if ($LASTEXITCODE) { throw 'git archive failed' }
          $open = Join-Path $env:TEMP '0f8fad5b-d9cb-469f-a165-70867728950e_FBRX-test (2).zip.d47\FBRX-test'
          New-Item -ItemType Directory -Force $open | Out-Null
          Copy-Item 'Install FBRX OS.cmd' $open
      # A small stand-in for the "fbrx-server-iso" download from GitHub Actions, where people put it: Downloads.
      - name: Put an FBRX Server ISO download in Downloads
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'fbrx-iso'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $iso = Join-Path $dir 'fbrx-server-ci-amd64.iso'
          $bytes = New-Object byte[] 2000000; (New-Object Random 7).NextBytes($bytes); [IO.File]::WriteAllBytes($iso, $bytes)
          "$((Get-FileHash $iso -Algorithm SHA256).Hash.ToLower())  fbrx-server-ci-amd64.iso" | Set-Content -NoNewline "$iso.sha256"
          Compress-Archive -Path $iso, "$iso.sha256" -DestinationPath (Join-Path $env:USERPROFILE 'Downloads\fbrx-server-iso.zip') -Force
      - name: Run "Install FBRX OS.cmd" from inside the zip
        shell: cmd
        env:
          FBRX_UNZIP_YES: '1'
          FBRX_UNZIP_TO: ${{ github.workspace }}
        run: call "%TEMP%\0f8fad5b-d9cb-469f-a165-70867728950e_FBRX-test (2).zip.d47\FBRX-test\Install FBRX OS.cmd" --yes --name "CI Runner" --no-launch
      - name: The app is installed and activates its license on first start
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\FBRX OS\FBRX OS.exe'
          $data = Join-Path $env:APPDATA 'FBRX OS'
          if (-not (Test-Path $exe)) { throw "FBRX OS.exe was not installed" }
          if (-not (Test-Path "$data\fbrx-license.key")) { throw "The license file was not written" }
          Start-Process $exe
          for ($i = 0; $i -lt 90; $i++) {
            if (-not (Test-Path "$data\fbrx-license.key") -and (Test-Path "$data\fbrx.db")) { break }
            Start-Sleep -Seconds 2
          }
          Get-ChildItem $data
          if (Test-Path "$data\fbrx-license.key.rejected") { throw "The license was rejected" }
          if (Test-Path "$data\fbrx-license.key") { throw "The app did not pick up its license" }
          if (-not (Get-Process -Name 'FBRX OS' -ErrorAction SilentlyContinue)) { throw "The app is not running" }
      - name: The FBRX Server installer ISO, bundle and guides came along
        shell: pwsh
        run: |
          $srv = Join-Path $env:LOCALAPPDATA 'Programs\FBRX OS\resources\server'
          Get-ChildItem -Recurse $srv | Format-Table FullName, Length
          foreach ($f in 'manifest.json', 'fbrx-server-ci-amd64.iso', 'docs\SERVER.md') { if (-not (Test-Path (Join-Path $srv $f))) { throw "$f is missing from the installed FBRX Server resources" } }
          if (-not (Get-ChildItem $srv -Filter 'fbrx-server-*.tar.gz')) { throw "The server bundle is missing" }
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $setup = Get-Item "apps/desktop/release/$version/FBRX-OS-Setup-$version.exe"
          "Setup.exe: $([math]::Round($setup.Length / 1MB)) MB"
      - name: Running the installer again updates the app while it is open
        shell: cmd
        run: call "Install FBRX OS.cmd" --yes --name "CI Runner" --no-launch
      - name: The installer asked the app to quit properly, and everything was kept
        shell: pwsh
        run: |
          $data = Join-Path $env:APPDATA 'FBRX OS'
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\FBRX OS\FBRX OS.exe'))) { throw "FBRX OS.exe missing after update" }
          if (Get-Process -Name 'FBRX OS' -ErrorAction SilentlyContinue) { throw "The installer did not close the running app" }
          if (-not (Select-String -Path "$data\logs\*.log" -Pattern 'Stopped cleanly' -Quiet)) { throw "The app was ended without shutting down cleanly" }
          if (-not (Test-Path "$data\fbrx.db")) { throw "Data was lost during the update" }

      # The Setup.exe switches behind the maintenance page: downgrade guard, repair, uninstall.
      - name: Setup refuses to downgrade silently unless allowed
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $setup = Resolve-Path "apps/desktop/release/$version/FBRX-OS-Setup-$version.exe"
          $key = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like 'FBRX OS*' } | Select-Object -First 1
          if (-not $key) { throw "No uninstall entry for FBRX OS" }
          Set-ItemProperty $key.PSPath -Name DisplayVersion -Value '99.0.0'
          $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 3) { throw "Expected exit code 3 for a downgrade, got $($p.ExitCode)" }
          $p = Start-Process $setup -ArgumentList '/S','/ALLOWDOWNGRADE' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Downgrade with /ALLOWDOWNGRADE failed: $($p.ExitCode)" }
          if ((Get-ItemProperty $key.PSPath).DisplayVersion -ne $version) { throw "Version not restored after reinstall" }
      - name: Repair closes the running app, clears caches and keeps data
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $setup = Resolve-Path "apps/desktop/release/$version/FBRX-OS-Setup-$version.exe"
          $data = Join-Path $env:APPDATA 'FBRX OS'
          Start-Process (Join-Path $env:LOCALAPPDATA 'Programs\FBRX OS\FBRX OS.exe')
          for ($i = 0; $i -lt 60 -and -not (Test-Path "$data\GPUCache"); $i++) { Start-Sleep -Seconds 1 }
          New-Item -ItemType Directory -Force "$data\GPUCache" | Out-Null
          Start-Sleep -Seconds 5
          $p = Start-Process $setup -ArgumentList '/S','/REPAIR' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Repair failed: $($p.ExitCode)" }
          if (Get-Process -Name 'FBRX OS' -ErrorAction SilentlyContinue) { throw "Repair did not close the app" }
          if (Test-Path "$data\GPUCache") { throw "Repair did not clear the caches" }
          if (-not (Test-Path "$data\fbrx.db")) { throw "Repair lost the data" }
      - name: Uninstall closes the app and keeps the data unless asked
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $setup = Resolve-Path "apps/desktop/release/$version/FBRX-OS-Setup-$version.exe"
          $data = Join-Path $env:APPDATA 'FBRX OS'
          Start-Process (Join-Path $env:LOCALAPPDATA 'Programs\FBRX OS\FBRX OS.exe')
          Start-Sleep -Seconds 10
          $p = Start-Process $setup -ArgumentList '/S','/UNINSTALL' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed: $($p.ExitCode)" }
          if (Get-Process -Name 'FBRX OS' -ErrorAction SilentlyContinue) { throw "Uninstall did not close the app" }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\FBRX OS\FBRX OS.exe')) { throw "FBRX OS is still installed" }
          if (-not (Test-Path "$data\fbrx.db")) { throw "Uninstall deleted the data without being asked" }

      # "Make an installer to send": a Setup.exe with a trial license built in, as a friend would receive it.
      - name: Make an installer to send to someone else
        shell: cmd
        run: call "Install FBRX OS.cmd" --yes --share --for "CI Friend" --days 7
      - name: The shared installer installs and licenses FBRX OS for them
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $setup = Resolve-Path "Share/FBRX-OS-Setup-$version-for-CI-Friend.exe"
          $data = Join-Path $env:APPDATA 'FBRX OS'
          $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Shared installer failed: $($p.ExitCode)" }
          if (-not (Test-Path "$data\fbrx-license.key")) { throw "The built-in license was not handed to the app" }
          Start-Process (Join-Path $env:LOCALAPPDATA 'Programs\FBRX OS\FBRX OS.exe')
          for ($i = 0; $i -lt 90 -and (Test-Path "$data\fbrx-license.key"); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path "$data\fbrx-license.key.rejected") { throw "The built-in license was rejected" }
          if (Test-Path "$data\fbrx-license.key") { throw "The app did not pick up the built-in license" }
          $p = Start-Process $setup -ArgumentList '/S','/UNINSTALL','--delete-app-data' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed: $($p.ExitCode)" }
          if (Test-Path "$data\fbrx.db") { throw "--delete-app-data kept the data" }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-log-windows
          path: |
            .fbrx-setup/setup.log
            ~/AppData/Roaming/FBRX OS/logs/
            apps/desktop/release/*/builder-debug.yml
          if-no-files-found: ignore

  command:
    name: FBRX Command (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Run "Install FBRX Command.command" (computers on this network)
        if: runner.os != 'Windows'
        run: bash "Install FBRX Command.command" --yes --network --no-open
      - name: Run "Install FBRX Command.cmd" (computers on this network)
        if: runner.os == 'Windows'
        shell: cmd
        run: call "Install FBRX Command.cmd" --yes --network --no-open
      - name: It answers here and on the network, with its own certificate, and first-run setup works
        run: node scripts/setup/check-command-install.mjs installed
        shell: bash
      - name: Running the installer again updates it in place
        if: runner.os != 'Windows'
        run: bash "Install FBRX Command.command" --yes --no-open
      - name: Running the installer again updates it in place
        if: runner.os == 'Windows'
        shell: cmd
        run: call "Install FBRX Command.cmd" --yes --no-open
      - name: Same certificate and accounts after the update
        run: node scripts/setup/check-command-install.mjs updated
        shell: bash
      - name: Remove it, keeping the data
        if: runner.os != 'Windows'
        run: bash "Install FBRX Command.command" --uninstall
      - name: Remove it, keeping the data
        if: runner.os == 'Windows'
        shell: cmd
        run: call "Install FBRX Command.cmd" --uninstall
      - name: Stopped, program and icons gone, data kept
        run: node scripts/setup/check-command-install.mjs removed
        shell: bash
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: command-installer-log-${{ matrix.os }}
          path: |
            .fbrx-setup/command-setup.log
            ~/Library/Application Support/FBRX Command/logs/
            ~/AppData/Local/FBRX Command/logs/
            ~/.local/share/fbrx-command/logs/
          if-no-files-found: ignore
