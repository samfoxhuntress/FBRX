name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The Electron binary is only needed to package the desktop app (release workflow).
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  verify:
    name: Typecheck, test & build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Build admin console, control plane, desktop and FBRX Virtual bundles
        run: |
          npm run build -w @fbrx/admin-console
          npm run build -w @fbrx/control-plane
          npm run build -w @fbrx/desktop
          npm run build:server
      - name: Pack example plugin
        run: node scripts/pack-plugin.mjs plugins/example-toolkit

  server:
    name: FBRX Server (real libvirt, installer bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install libvirt, QEMU and UEFI firmware
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libvirt-daemon-system libvirt-clients qemu-system-x86 qemu-utils ovmf dnsmasq-base nftables iproute2 conntrack shellcheck >/dev/null
          sudo systemctl start libvirtd
          sudo virsh -c qemu:///system net-start default || true
      - run: npm ci --no-audit --no-fund
      - name: Check the installer scripts
        run: shellcheck scripts/server/*.sh scripts/server/fbrx-server scripts/server/fbrx-gate
      - name: Build the FBRX Server bundle
        run: scripts/server/bundle.sh --with-node
      - name: Smoke-test the bundle (the FBRX core in server mode, managed by FBRX Virtual)
        run: scripts/server/smoke.sh "$(ls -d dist/fbrx-server-*/ | head -1)"
      - name: The ISO's first start on Debian 13 (a fresh Debian root, the install disc still a package source)
        run: |
          sudo apt-get install -y -qq --no-install-recommends debootstrap debian-archive-keyring >/dev/null
          sudo scripts/server/test-debian-firstboot.sh "$(ls -d dist/fbrx-server-*/ | head -1)"
      - name: FBRX Gate as a real router, FBRX MiniDome listening to it, and Prefer Mesh marking (network namespaces)
        # As root: namespaces, nftables, dnsmasq, tc and conntrack (FBRX MiniDome listening to the gate). VLANs and cake
        # are used where the runner's kernel has them.
        run: sudo -E env "PATH=$PATH" npx vitest run packages/gate/test/netns.integration.test.ts packages/core/test/mesh-network.test.ts
      - name: FBRX Virtual against the real hypervisor
        # As root, like FBRX Server, against libvirt's system hypervisor (after the build, so root leaves no files in
        # the way). Software emulation keeps it independent of the runner's KVM.
        run: sudo -E env "PATH=$PATH" FBRX_TEST_LIBVIRT=1 FBRX_V_DOMAIN_TYPE=qemu npx vitest run apps/virtual/test/libvirt.integration.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: fbrx-server-bundle
          path: dist/fbrx-server-*.tar.gz
          retention-days: 14

  docker:
    name: Control plane image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fbrx/control-plane:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
