name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The Electron binary is only needed to package the desktop app (release workflow).
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  verify:
    name: Typecheck, test & build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Build admin console, control plane and desktop bundles
        run: |
          npm run build -w @fbrx/admin-console
          npm run build -w @fbrx/control-plane
          npm run build -w @fbrx/desktop
      - name: Pack example plugin
        run: node scripts/pack-plugin.mjs plugins/example-toolkit

  docker:
    name: Control plane image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fbrx/control-plane:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
