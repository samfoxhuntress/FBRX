# FBRX OS desktop packaging (macOS + Windows, Linux for labs).
# Signing (docs/DEPLOYMENT.md): CSC_LINK/CSC_KEY_PASSWORD + APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID on macOS;
# on Windows, Azure Trusted Signing (-c.win.azureSignOptions.*, set by the Release workflow) or CSC_LINK with a .pfx.
appId: com.fbrx.os
productName: FBRX OS
copyright: Copyright © 2026 FBRX
directories:
  output: release/${version}
  buildResources: build
files:
  - dist/**
  - package.json
  - "!**/*.map"
asarUnpack:
  # Forked as a separate (sandboxed) Node process; must live on the real filesystem.
  - dist/main/plugin-worker.mjs
  # Started by other AI apps (Claude Desktop, Cursor, …) with the app executable in Node mode.
  - dist/main/fbrx-mcp.mjs
  # FBRX Mobile, served to paired phones over the local network.
  - dist/main/mobile/**
  # The IEEE MAC vendor registry, read from the unpacked folder next to the other runtime files.
  - dist/main/oui-vendors.tsv.gz
extraResources:
  # Bundled local AI runtime (llama.cpp). Populated by `npm run runtime:fetch` (CI does this per platform).
  # If it is missing, users can install it from the app (Local AI → Install runtime).
  - from: resources/runtime/${platform}-${arch}
    to: runtime/${platform}-${arch}
    filter: ["**/*"]
  - from: resources/provisioning
    to: provisioning
    filter: ["*.json"]
protocols: []
publish:
  # Updates are served per device by the FBRX control plane (generic provider). The feed URL is set
  # at runtime once the device enrolls, so builds stay environment-neutral.
  - provider: generic
    url: https://updates.invalid/fbrx
mac:
  category: public.app-category.productivity
  # Arch in the name lets electron-updater pick the right zip on Apple silicon vs Intel.
  artifactName: FBRX-OS-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  extendInfo:
    NSMicrophoneUsageDescription: FBRX OS listens when you press the microphone button so you can talk to Fabrix. Speech is turned into text on this Mac.
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extraResources:
    # FBRX Server resources (installer ISO, server bundle, guides) from scripts/server/endpoint-resources.mjs, when
    # gathered. Windows Setup adds them itself, once for both processor types (build/installer.nsh).
    - from: resources/server
      to: server
      filter: ["**/*"]
dmg:
  sign: false
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  signtoolOptions:
    # Must match the certificate subject; electron-updater refuses updates signed by anyone else.
    publisherName: FBRX
nsis:
  # Maintenance mode (upgrade / repair / uninstall), closing a running app, silent switches and license drop.
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FBRX OS
  # x64 + arm64 are combined into one installer that picks the right build at install time.
  artifactName: FBRX-OS-Setup-${version}.${ext}
  # The FBRX logo on the welcome and finish pages (generated by scripts/make-icons.mjs).
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
linux:
  extraResources:
    - from: resources/server
      to: server
      filter: ["**/*"]
  executableName: fbrx-os
  target: [AppImage]
  artifactName: FBRX-OS-${version}-${arch}.${ext}
  category: Utility
